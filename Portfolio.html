<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Portfolio CV</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --display: "Inter Tight", system-ui, sans-serif;
    --body:    "Inter Tight", system-ui, sans-serif;
    --mono:    "JetBrains Mono", ui-monospace, monospace;
  }

  [data-theme="dark"], html[data-theme="dark"] {
    --bg:          oklch(0.16 0.005 250);
    --bg-elev:     oklch(0.195 0.006 250);
    --fg:          oklch(0.96  0.005 250);
    --fg-dim:      oklch(0.66  0.008 250);
    --border:      oklch(0.28  0.006 250);
    --accent:      oklch(0.78  0.16 142);
    --placeholder-a: oklch(0.20 0.005 250);
    --placeholder-b: oklch(0.225 0.006 250);
  }
  [data-theme="light"], html[data-theme="light"] {
    --bg:          oklch(0.985 0.003 250);
    --bg-elev:     oklch(0.965 0.004 250);
    --fg:          oklch(0.18  0.008 250);
    --fg-dim:      oklch(0.45  0.008 250);
    --border:      oklch(0.86  0.006 250);
    --accent:      oklch(0.58  0.16 142);
    --placeholder-a: oklch(0.93 0.005 250);
    --placeholder-b: oklch(0.90 0.005 250);
  }

  html, body { margin: 0; padding: 0; }
  ::selection {
    background: var(--accent);
    color: var(--bg);
  }
  body {
    font-family: var(--body);
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  .cv-root {
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    font-family: var(--body);
  }

  .cv-cta {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 22px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.01em;
    transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
  }
  .cv-cta:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .cv-cta.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .cv-cta.primary:hover { color: var(--bg); filter: brightness(1.05); }

  /* Custom cursor — Tiny dot · B */
  @media (pointer: fine) {
    body, html { cursor: none !important; }
    a, button, input, textarea, label, select, [data-cursor], [role="button"] { cursor: none !important; }
  }
  .cv-cursor-dot {
    position: fixed; top: 0; left: 0;
    pointer-events: none;
    z-index: 99999;
    will-change: transform;
    width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 999px;
    background: var(--fg);
    transition:
      width 0.15s cubic-bezier(.2,.7,.3,1),
      height 0.15s cubic-bezier(.2,.7,.3,1),
      margin 0.15s cubic-bezier(.2,.7,.3,1),
      background 0.15s,
      border-radius 0.15s,
      opacity 0.15s;
  }
  .cv-cursor-dot[data-state="pointer"] {
    background: var(--accent);
  }
  .cv-cursor-dot[data-state="text"] {
    width: 2px; height: 18px; margin: -9px 0 0 -1px;
    border-radius: 1px;
  }

  * {
    scrollbar-color: color-mix(in oklab, var(--accent) 45%, var(--border)) transparent;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in oklab, var(--accent) 30%, var(--border));
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
  }

  /* Top-level navigation between landing and detail */
  .cv-pagebtn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg-dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .cv-pagebtn[data-active="true"] {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
  }
</style>
</head>
<body data-theme="dark">

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="filters.jsx"></script>
<script type="text/babel" src="thumbs.jsx"></script>
<script type="text/babel" src="variants.jsx"></script>
<script type="text/babel" src="detail.jsx"></script>

<script type="text/babel">
  const { useState: useS } = React;

  function Page() {
    const { theme } = useApp();
    // simple in-app router: "home" | "detail"
    const [page, setPage] = useS("home");
    const [projectId, setProjectId] = useS("smakosz");

    React.useEffect(() => {
      const handleHash = () => {
        const hash = window.location.hash;
        if (hash.startsWith("#project-")) {
          const id = hash.replace("#project-", "");
          setProjectId(id);
          setPage("detail");
          window.scrollTo(0, 0);
        } else {
          setPage("home");
        }
      };

      handleHash();
      window.addEventListener("hashchange", handleHash);
      return () => window.removeEventListener("hashchange", handleHash);
    }, []);

    const navigateToDetail = (id) => {
      window.location.hash = `project-${id}`;
    };

    const navigateToHome = () => {
      window.location.hash = "";
    };

    return (
      <div className="cv-root" data-theme={theme} data-screen-label={page === "home" ? "Landing" : `Project · ${projectId}`}>
        <TopBar artboardId={page === "home" ? "home" : projectId} />
        <PageSwitcher page={page} setPage={(p) => { if (p === "home") navigateToHome(); else navigateToDetail(projectId); }} />
        {page === "home"   && <Landing onOpenDetail={navigateToDetail} />}
        {page === "detail" && <DetailSplit projectId={projectId} onBack={navigateToHome} />}
      </div>
    );
  }

  function PageSwitcher({ page, setPage }) {
    return (
      <div style={{
        position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)",
        display: "flex", gap: 6, padding: 6,
        background: "color-mix(in oklab, var(--bg-elev) 92%, transparent)",
        backdropFilter: "blur(8px)",
        border: "1px solid var(--border)", borderRadius: 999,
        zIndex: 50,
      }}>
        <button className="cv-pagebtn" data-active={page === "home"}
                onClick={() => setPage("home")}>Landing</button>
        <button className="cv-pagebtn" data-active={page === "detail"}
                onClick={() => setPage("detail")}>Project detail</button>
      </div>
    );
  }

  function Landing({ onOpenDetail }) {
    return (
      <>
        <Hero />
        <ProjectMosaic wrapWithSidebar={true} ThumbComp={ThumbStripes} onOpenDetail={onOpenDetail} />
        <Skills onOpenDetail={onOpenDetail} />
        <About />
        <Experience />
        <Contact />
      </>
    );
  }

  function Root() {
    return (
      <AppProvider>
        <CustomCursor />
        <Page />
      </AppProvider>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>

</body>
</html>
