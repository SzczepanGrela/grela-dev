<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Skills Explorations — design canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --display: "Inter Tight", system-ui, sans-serif;
    --body:    "Inter Tight", system-ui, sans-serif;
    --mono:    "JetBrains Mono", ui-monospace, monospace;
  }

  [data-theme="dark"] {
    --bg:          oklch(0.16 0.005 250);
    --bg-elev:     oklch(0.195 0.006 250);
    --fg:          oklch(0.96  0.005 250);
    --fg-dim:      oklch(0.66  0.008 250);
    --border:      oklch(0.28  0.006 250);
    --accent:      oklch(0.78  0.16 142);
    --placeholder-a: oklch(0.20 0.005 250);
    --placeholder-b: oklch(0.225 0.006 250);
  }
  [data-theme="light"] {
    --bg:          oklch(0.985 0.003 250);
    --bg-elev:     oklch(0.965 0.004 250);
    --fg:          oklch(0.18  0.008 250);
    --fg-dim:      oklch(0.45  0.008 250);
    --border:      oklch(0.86  0.006 250);
    --accent:      oklch(0.58  0.16 142);
    --placeholder-a: oklch(0.93 0.005 250);
    --placeholder-b: oklch(0.90 0.005 250);
  }

  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--body);
    background: oklch(0.10 0.005 250);
    color: oklch(0.96 0.005 250);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  .cv-artboard-root {
    background: var(--bg);
    color: var(--fg);
    min-height: 100%;
    font-family: var(--body);
  }

  .cv-cta {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 22px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.01em;
    transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
  }
  .cv-cta:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .cv-cta.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .cv-cta.primary:hover { color: var(--bg); filter: brightness(1.05); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(0.30 0.006 250); border-radius: 999px; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="filters.jsx"></script>
<script type="text/babel" src="thumbs.jsx"></script>
<script type="text/babel" src="variants.jsx"></script>
<script type="text/babel" src="detail.jsx"></script>
<script type="text/babel" src="skills-variants.jsx"></script>

<script type="text/babel">
  function ArtboardShell({ id, children }) {
    return (
      <AppProvider>
        <ArtboardScope id={id}>
          {children}
        </ArtboardScope>
      </AppProvider>
    );
  }

  function ArtboardScope({ id, children }) {
    const { theme } = useApp();
    return (
      <div className="cv-artboard-root" data-theme={theme} data-screen-label={id}>
        <TopBar artboardId={id} />
        {children}
      </div>
    );
  }

  function SkillsArtboard({ Comp, id }) {
    return (
      <ArtboardShell id={id}>
        <Comp />
      </ArtboardShell>
    );
  }

  function App() {
    return (
      <>
        <CustomCursor />
        <DesignCanvas
          title="Portfolio · CV — Skills section"
          subtitle="Six directions for the skills/stack section. Same data, different framings."
        >
          <DCSection id="skills" title="Skills section — explorations">

            <DCArtboard id="V0" label="0 — Baseline (current)" width={1600} height={900}>
              <SkillsArtboard Comp={SkillsV0_Baseline} id="0 · Baseline" />
            </DCArtboard>

            <DCArtboard id="V1" label="1 — Proficiency bars + years" width={1600} height={1100}>
              <SkillsArtboard Comp={SkillsV1_Bars} id="1 · Bars" />
            </DCArtboard>

            <DCArtboard id="V2" label="2 — Heatmap (projects × tools)" width={1600} height={1100}>
              <SkillsArtboard Comp={SkillsV2_Heatmap} id="2 · Heatmap" />
            </DCArtboard>

            <DCArtboard id="V3" label="3 — Weighted tag cloud" width={1600} height={1000}>
              <SkillsArtboard Comp={SkillsV3_Cloud} id="3 · Cloud" />
            </DCArtboard>

            <DCArtboard id="V4" label="4 — Radar / domain shape" width={1600} height={1100}>
              <SkillsArtboard Comp={SkillsV4_Radar} id="4 · Radar" />
            </DCArtboard>

            <DCArtboard id="V5" label="5 — Terminal output" width={1600} height={1300}>
              <SkillsArtboard Comp={SkillsV5_Terminal} id="5 · Terminal" />
            </DCArtboard>

            <DCArtboard id="V6" label="6 — Pivot (skill ↔ project)" width={1600} height={1300}>
              <SkillsArtboard Comp={SkillsV6_Pivot} id="6 · Pivot" />
            </DCArtboard>

            <DCArtboard id="V7" label="7 — Wariacja 1: Interaktywny Grid (Baseline + highlight)" width={1600} height={1100}>
              <SkillsArtboard Comp={SkillsV7_Var1} id="7 · Var1" />
            </DCArtboard>

            <DCArtboard id="V8" label="8 — Wariacja 2: Grid z filtrowaniem projektów" width={1600} height={1100}>
              <SkillsArtboard Comp={SkillsV8_Var2} id="8 · Var2" />
            </DCArtboard>

            <DCArtboard id="V9" label="9 — Wariacja 3: Clean Split z detalem" width={1600} height={1200}>
              <SkillsArtboard Comp={SkillsV9_Var3} id="9 · Var3" />
            </DCArtboard>

          </DCSection>
        </DesignCanvas>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
